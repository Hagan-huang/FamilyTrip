<!DOCTYPE html>
<html lang="zh-Hant" data-theme="lacquer" data-ver="1.2.0" data-date="2026-11-17" class="has-cover">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>越南跨年之旅</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://api.open-meteo.com https://open.er-api.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0e0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family trip">
<link rel="manifest" href="manifest.webmanifest?v=1.2.0">
<link rel="icon" href="images/icon-192.png?v=1.2.0">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=1.2.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* ============ 風格變數 ============ */
:root{
  --bg:#0e0c0b;--bg2:#161311;--card:rgba(239,230,214,.055);--card2:rgba(239,230,214,.1);
  --ink:#efe6d6;--mute:rgba(239,230,214,.6);--faint:rgba(239,230,214,.3);--line:rgba(239,230,214,.14);
  --acc:#db5236;--acc-soft:rgba(219,82,54,.18);--acc-ink:#fff6ee;--warn:#ff6b5a;
  --ticket:#efe3c8;--ticket-ink:#2a221a;--ticket-mute:rgba(42,34,26,.58);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --head:var(--serif);--r:16px;--glow:none;--theme:#0e0c0b;
}
html[data-theme=indo]{
  --bg:#f2e7c9;--bg2:#eadcb6;--card:#fbf5e2;--card2:#f1e5c2;
  --ink:#27362d;--mute:#667060;--faint:#a5a587;--line:rgba(39,54,45,.2);
  --acc:#2c6b57;--acc-soft:rgba(44,107,87,.16);--acc-ink:#fdf8e8;--warn:#b8442c;
  --ticket:#fffaf0;--ticket-ink:#27362d;--ticket-mute:rgba(39,54,45,.6);
  --head:"Playfair Display","Noto Serif TC","Songti TC",serif;--r:8px;--theme:#f2e7c9;
}
html[data-theme=neon]{
  --bg:#0a0618;--bg2:#120a2a;--card:rgba(150,120,255,.1);--card2:rgba(150,120,255,.18);
  --ink:#eeeaff;--mute:#aaa3d6;--faint:#655c98;--line:rgba(160,140,255,.24);
  --acc:#ff3fa8;--acc-soft:rgba(255,63,168,.2);--acc-ink:#fff;--warn:#ffb02e;
  --ticket:#f3ecff;--ticket-ink:#1a1036;--ticket-mute:rgba(26,16,54,.6);
  --head:"Chakra Petch",var(--sans);--r:14px;--glow:0 0 14px rgba(255,63,168,.55);--theme:#0a0618;
}
/* ============ 基本 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0 auto;max-width:520px;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);
  padding-bottom:calc(72px + env(safe-area-inset-bottom));overflow-x:hidden;transition:background .4s,color .4s}
html[data-theme=indo] body{background:var(--bg) repeating-linear-gradient(45deg,transparent 0 18px,rgba(39,54,45,.03) 18px 19px)}
html[data-theme=neon] body{background:radial-gradient(120% 60% at 50% 0,#1c0f45 0,var(--bg) 60%)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;transition:transform .12s}
button:active,.tap:active{transform:scale(.95)}
a{color:inherit}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.ic.s{width:16px;height:16px;vertical-align:-3px}.ic.l{width:26px;height:26px}
.num{font-family:var(--head);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.acc{color:var(--acc)}.nowrap{white-space:nowrap}
.hide{display:none!important}
/* ============ 離線提示／Toast ============ */
#offbar{position:fixed;top:0;left:0;right:0;z-index:60;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;text-align:center;
  font-size:12px;background:var(--acc);color:var(--acc-ink);transform:translateY(-100%);visibility:hidden;transition:transform .3s}
#offbar.on{transform:none;visibility:visible}
body.off .ph{padding-top:calc(env(safe-area-inset-top) + 48px)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:90;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ============ 封面 ============ */
#cover{position:fixed;inset:0;z-index:50;background:#0b0908;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  transition:opacity .6s,visibility .6s,transform .7s}
#cover.out{opacity:0;visibility:hidden;transform:scale(1.06)}
#cvTitle span{display:inline-block;animation:charin .8s cubic-bezier(.2,.8,.2,1) both}
#cover .art{position:absolute;inset:-4%;background:center/cover no-repeat;animation:push 26s ease-out both}
#cover canvas{position:absolute;inset:0;width:100%;height:100%}
#cover .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,9,8,0) 30%,rgba(11,9,8,.72) 62%,#0b0908 92%)}
#cover .inner{position:relative;padding:0 28px calc(46px + env(safe-area-inset-bottom));color:#efe6d6;max-width:520px;margin:0 auto;width:100%}
#cover .kicker{font-size:11px;letter-spacing:.32em;color:rgba(239,230,214,.62)}
#cover h1{font:700 40px/1.2 var(--serif);margin:10px 0 6px;letter-spacing:.06em}
#cover .sub{font-size:13px;color:rgba(239,230,214,.7);letter-spacing:.08em}
#cover .rule{width:56px;height:2px;background:#db5236;margin:18px 0 26px;transform-origin:left;animation:draw .9s .3s both}
#enter{display:block;width:100%;padding:15px;border-radius:99px;border:1px solid rgba(219,82,54,.8);color:#efe6d6;font-size:15px;
  letter-spacing:.14em;animation:breath 2.8s ease-in-out infinite}
#enter small{display:block;font-size:11px;letter-spacing:.2em;color:rgba(239,230,214,.6);margin-top:2px}
/* ============ 登入 ============ */
#login{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;overflow:auto}
#login.on{display:block}
#login .box{position:relative;max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 54px) 28px 40px}
#login h2{font:700 28px/1.3 var(--head);margin:6px 0 4px}
.field{margin-top:18px}
.field label{display:block;font-size:12px;color:var(--mute);letter-spacing:.1em;margin-bottom:6px}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:0;font-size:16px}
.inp:focus{border-color:var(--acc)}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:600;letter-spacing:.1em;
  text-align:center;box-shadow:var(--glow)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);box-shadow:none;font-weight:400}
.btn.sm{display:inline-block;width:auto;padding:7px 14px;font-size:13px;border-radius:99px;letter-spacing:.04em}
.btn[disabled]{opacity:.5}
.err{color:var(--warn);font-size:13px;margin-top:12px;min-height:20px}
/* ============ 分頁框架 ============ */
.page{display:none}.page.on{display:block}
.ph{padding:calc(env(safe-area-inset-top) + 26px) 20px 6px;background:center/cover no-repeat}
.ph-code{font-size:11px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
.ph-code i{font-style:normal;opacity:.5;margin:0 6px}
.ph-code span{letter-spacing:.06em;text-transform:none}
.ph h1{font:700 32px/1.25 var(--head);margin:4px 0 10px;letter-spacing:.04em;text-shadow:var(--glow)}
.ph-line{width:56px;height:2px;background:var(--acc);transform-origin:left;box-shadow:var(--glow)}
.page.on .ph-line{animation:draw .7s ease-out both}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 16px}
html[data-theme=indo] .card{border:1px solid var(--line);box-shadow:3px 3px 0 rgba(39,54,45,.12)}
html[data-theme=neon] .card{border:1px solid var(--line)}
.card h3{font:500 12px/1 var(--sans);letter-spacing:.2em;color:var(--mute);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;letter-spacing:.04em;font-size:11px}
#p-home.on .card{animation:rise .5s ease-out both}
.row{display:flex;align-items:center;gap:10px}.row .grow{flex:1;min-width:0}
.big{font:700 34px/1.1 var(--head);font-variant-numeric:tabular-nums}
.big small{font:400 13px var(--sans);color:var(--mute);margin:0 6px 0 3px}
/* 底部選單 */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
#nav .in{max-width:520px;margin:0 auto;display:flex}
#nav button{flex:1;padding:9px 0 12px;font-size:10.5px;letter-spacing:.12em;color:var(--mute);position:relative}
#nav button .ic{display:block;margin:0 auto 3px;width:22px;height:22px}
#nav button:after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--acc);
  transform:translateX(-50%) scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1);box-shadow:var(--glow)}
#nav button.on{color:var(--ink)}#nav button.on:after{transform:translateX(-50%) scale(1)}
/* ============ 主頁 ============ */
.hero .date{font-size:13px;color:var(--mute);letter-spacing:.08em}
.next-t{font:700 19px/1.4 var(--head);margin:2px 0;text-wrap:balance}
.sum{list-style:none;margin:10px 0 0;padding:0;font-size:13.5px}
.sum li{display:flex;gap:10px;padding:4px 0}.sum li b{font-weight:400;color:var(--mute);width:42px;flex:none;font-variant-numeric:tabular-nums}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tools button{padding:10px 0 6px;border-radius:12px;font-size:11px;color:var(--mute);line-height:1.3;white-space:nowrap}
.tools button .ic{display:block;margin:0 auto 7px;width:44px;height:44px;padding:10px;border-radius:14px;background:var(--card2);color:var(--ink)}
.tools button.sos .ic{color:var(--acc);background:var(--acc-soft)}
.wx-now{display:flex;align-items:center;gap:12px}
.wx-now .ic{width:34px;height:34px}
.wx-days{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:12px;text-align:center;font-size:12px}
.wx-days .ic{display:block;margin:4px auto}
.wx-days b{display:block;font-weight:400;color:var(--mute)}
.fx-row{display:flex;gap:8px;align-items:center;margin-top:10px}
.fx-row .inp{padding:10px 12px}
.bar{height:4px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .6s}
.themes{display:flex;gap:8px}
.themes button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--line);font-size:12px}
.themes button.on{border-color:var(--acc);color:var(--acc)}
.themes .sw{display:flex;justify-content:center;gap:3px;margin-bottom:6px}
.themes .sw i{width:14px;height:14px;border-radius:50%;display:block;border:1px solid rgba(128,128,128,.4)}
.foot{text-align:center;font-size:10.5px;letter-spacing:.18em;color:var(--faint);padding:18px 0 8px}
.foot button{color:var(--mute);text-decoration:underline;letter-spacing:.04em;font-size:11px;margin-top:8px}
/* ============ 航班（車票） ============ */
.ticket{background:var(--ticket);color:var(--ticket-ink);border-radius:14px;margin:14px 16px;position:relative;animation:rise .55s ease-out both;
  box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tk-top{padding:16px 18px 14px}
.tk-dir{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.18em;color:var(--ticket-mute)}
.tk-route{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.tk-route .code{font:700 34px/1 var(--head);letter-spacing:.04em}
.tk-route .city{font-size:12px;color:var(--ticket-mute);white-space:nowrap}
.tk-route .time{font:700 17px var(--head);font-variant-numeric:tabular-nums}
.tk-mid{flex:1;text-align:center;font-size:11px;color:var(--ticket-mute);padding:0 8px;position:relative}
.tk-mid:before{content:"";position:absolute;left:10px;right:10px;top:11px;border-top:1px dashed rgba(42,34,26,.35)}
.tk-mid .ic{position:relative;background:var(--ticket);padding:0 6px;width:34px;color:var(--acc)}
.tk-mid span{display:block;margin-top:2px;white-space:nowrap}
.tk-tear{position:relative;border-top:1.5px dashed rgba(42,34,26,.3);margin:0 16px}
.tk-tear:before,.tk-tear:after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.tk-tear:before{left:-25px}.tk-tear:after{right:-25px}
.tk-bot{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:8px;padding:12px 18px 14px;font-size:13px}
.tk-bot b{display:block;font-weight:400;font-size:10px;letter-spacing:.14em;color:var(--ticket-mute)}
.tk-note{padding:0 18px 14px;font-size:12px;color:var(--ticket-mute)}
.route-txt{white-space:nowrap}
/* ============ 行程 ============ */
.axis-wrap{position:sticky;top:calc(env(safe-area-inset-top) - 32px);z-index:6;margin:10px 0 0;padding:40px 16px 8px}
.axis-wrap.stuck #mascot{opacity:0}
.axis-wrap.stuck{background:var(--nav);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--line)}
.axis{display:flex;gap:6px}
.axis button{flex:1;padding:8px 0 9px;border-radius:12px;background:var(--card);font-size:11px;color:var(--mute);line-height:1.35}
.axis button b{display:block;font:700 17px var(--head);color:var(--ink);font-variant-numeric:tabular-nums}
.axis button.on{background:var(--acc);color:var(--acc-ink);box-shadow:var(--glow)}.axis button.on b{color:var(--acc-ink)}
.axis button.today:not(.on){box-shadow:inset 0 0 0 1px var(--acc)}
#mascot{position:absolute;top:0;left:0;width:62px;height:44px;margin-left:-31px;transition:transform .55s cubic-bezier(.5,0,.2,1.2);pointer-events:none}
#mascot.go .body{animation:putt .5s}
.groups{display:flex;gap:6px;margin:10px 16px 0}
.groups button{padding:5px 14px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--mute)}
.groups button.on{border-color:var(--acc);color:var(--acc)}
.day h2{font:700 21px/1.35 var(--head);margin:0 0 8px;text-wrap:balance}
.day .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute)}
.day .meta span{display:inline-flex;align-items:center;gap:5px}
.day .share{position:absolute;right:12px;top:12px;padding:6px;color:var(--mute)}
.day{position:relative}
.live{display:inline-block;font-size:10px;letter-spacing:.16em;color:var(--acc);border:1px solid var(--acc);border-radius:99px;padding:1px 8px;margin-bottom:8px}
.tl{position:relative;margin:6px 16px 0;padding-left:64px}
.tl:before{content:"";position:absolute;left:52px;top:14px;bottom:10px;width:1px;background:var(--line);transform-origin:top}
.tl.in:before{animation:grow .9s ease-out both}
.tl.in .ti{animation:tin .45s ease-out both}
.ti.now .ti-dot:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--acc);animation:ring 1.8s ease-out infinite}
.ti{position:relative;padding:9px 0 13px;transition:opacity .3s}
.ti-time{position:absolute;left:-64px;top:10px;width:42px;text-align:right;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.ti-dot{position:absolute;left:-15.5px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.ti-tt{font-size:15.5px;line-height:1.45}
.ti-tags{display:flex;flex-wrap:wrap;gap:5px 6px;margin-top:5px;font-size:11px;color:var(--mute)}
.tag{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:99px;background:var(--card2);white-space:nowrap}
.tag.o{background:none;border:1px dashed var(--faint)}
.tag.a{background:var(--acc-soft);color:var(--acc)}
.tag.hot{background:var(--warn);color:#fff}
.tag.meet{background:var(--acc);color:var(--acc-ink)}
.ti-note{font-size:12.5px;color:var(--mute);margin-top:4px}
.ti a.map{color:inherit;text-decoration:none}.ti a.map .ic{color:var(--acc)}
.ti.past{opacity:.4}
.ti.now .ti-dot{background:var(--acc);box-shadow:0 0 0 5px var(--acc-soft)}
.ti.now .ti-tt{font-weight:600}
.ti.next .ti-dot{background:none;box-shadow:inset 0 0 0 1.5px var(--acc)}
.ti.type-備註 .ti-tt{font-size:14px;color:var(--mute)}
.swipe-hint{text-align:center;font-size:11px;letter-spacing:.14em;color:var(--faint);padding:20px 0 6px}
.empty{text-align:center;color:var(--mute);font-size:13px;padding:30px 20px}
/* 換日期轉場 */
#swoosh{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden;display:none}
#swoosh.on{display:block}
#swoosh i{position:absolute;left:-30%;right:-30%;top:46%;height:74px;background:linear-gradient(90deg,transparent,var(--acc) 30%,var(--acc) 70%,transparent);
  transform:rotate(-9deg) translateX(-120%);border-radius:50%;filter:blur(.5px);opacity:.92;animation:sweep .5s cubic-bezier(.45,.05,.55,.95) both}
#swoosh.rev i{animation-name:sweepR}
#swoosh b{position:absolute;right:12%;top:36%;font:700 44px var(--head);color:var(--ink);font-style:italic;letter-spacing:.02em;
  text-shadow:0 2px 0 var(--bg),0 0 12px var(--bg);animation:pop .5s both;z-index:2}
#swoosh.rev b{right:auto;left:12%}
html[data-theme=indo] #swoosh i{height:100%;top:0;left:0;right:0;border-radius:0;opacity:.9;transform:none;
  background:repeating-linear-gradient(0deg,var(--acc) 0 26px,transparent 26px 34px);animation-name:shutter}
html[data-theme=neon] #swoosh i{height:8px;box-shadow:0 0 30px 10px var(--acc),0 0 80px 20px #2de2ff;background:#fff}
/* ============ 準備 ============ */
.lanterns{display:flex;justify-content:center;gap:5px;margin:22px 16px 4px;position:relative;padding-top:10px}
.lanterns:before{content:"";position:absolute;left:8%;right:8%;top:2px;border-top:1px solid var(--faint)}
.lanterns span{position:relative;width:38px;height:46px;border-radius:50%/46%;border:1.5px solid var(--acc);background:var(--acc-soft);
  display:grid;place-items:center;font:700 17px var(--head);color:var(--ink);box-shadow:var(--glow);
  transform-origin:50% -8px;animation:sway 4.5s ease-in-out infinite,lamp 3.2s ease-in-out infinite}
.lanterns span:nth-child(2n){animation-delay:-1.6s}.lanterns span:nth-child(3n){animation-delay:-2.9s}
.lanterns span:before{content:"";position:absolute;top:-9px;left:50%;width:1px;height:8px;background:var(--faint)}
.lanterns span:after{content:"";position:absolute;bottom:-10px;left:50%;width:1.5px;height:9px;background:var(--acc)}
.count{text-align:center;font-size:12px;letter-spacing:.14em;color:var(--mute);margin:12px 0 0}
.list{list-style:none;margin:8px 16px 0;padding:0}
.list li{display:flex;align-items:flex-start;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);position:relative}
.list .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);flex:none;margin-top:1px;display:grid;place-items:center}
.list .ck .ic{width:13px;height:13px;stroke-width:2.4;opacity:0}
.list li.done .ck{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.list li.done .ck .ic{opacity:1}
.list .tx{flex:1;min-width:0}.list li.done .tx{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--faint)}
.list .del{color:var(--faint);padding:9px;margin:-7px -8px -7px 0;opacity:.8}
.stamp{position:absolute;right:34px;top:50%;margin-top:-17px;padding:3px 9px;border:2px solid var(--acc);border-radius:6px;color:var(--acc);
  font:700 12px var(--head);letter-spacing:.12em;transform:rotate(-9deg);transform-origin:100% 50%;opacity:0;pointer-events:none;background:var(--bg);white-space:nowrap}
.list li.done .stamp{opacity:.85}
.list li.stamping .stamp{animation:stamp .45s cubic-bezier(.2,1.4,.4,1) both}
.adder{display:flex;gap:8px;margin:12px 16px 0}
.adder .inp{padding:11px 14px}
.adder button{width:46px;border-radius:12px;background:var(--card2);flex:none;display:grid;place-items:center}
.hotel h4{font:700 18px/1.4 var(--head);margin:0 0 6px}
.hotel p{margin:4px 0;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.hotel p .ic{margin-top:3px}
/* ============ 記帳 ============ */
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:12px 16px 0}
.seg button{flex:1;padding:8px 10px;border-radius:10px;font-size:13px;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--acc-ink);box-shadow:var(--glow)}
.seg.sm{margin:0;display:inline-flex;flex:none}.seg.sm button{padding:5px 12px;font-size:12px}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding:6px 0}
.amt .sym{font:700 20px var(--head);color:var(--mute)}
.amt input{flex:1;min-width:0;background:none;border:0;outline:0;font:700 36px var(--head);font-variant-numeric:tabular-nums;padding:0}
.amt .eq{font-size:12px;color:var(--mute);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{padding:6px 12px;border-radius:99px;background:var(--card2);font-size:12.5px;font-variant-numeric:tabular-nums}
.chips button.on{background:var(--acc);color:var(--acc-ink)}
.chips.line button{background:none;border:1px solid var(--line)}
.chips.line button.on{background:var(--acc);border-color:var(--acc)}
.lbl{font-size:11px;letter-spacing:.16em;color:var(--mute);margin:16px 0 0}
.who{display:flex;align-items:center;gap:8px;margin-top:8px}
.who .inp{padding:8px 10px;width:120px;text-align:right}
.led{list-style:none;margin:0;padding:0}
.led li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.led li:last-child{border:0}
.led .c{font-size:11px;color:var(--mute);flex:none;width:52px}
.led .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led .n small{color:var(--mute);font-size:11px;margin-left:4px}
.led .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.led .x{color:var(--faint);padding:8px 5px;margin:-8px -5px -8px 0;min-width:26px}
.dayhd{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);letter-spacing:.08em;margin:14px 0 2px}
.settle li{display:flex;align-items:center;gap:8px;padding:9px 0;font-size:14.5px}
.settle{list-style:none;margin:0;padding:0}
.settle .v{margin-left:auto;font:700 16px var(--head);font-variant-numeric:tabular-nums}
/* ============ 彈出面板 ============ */
#sheet{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#sheet.on{display:block;animation:rise .3s ease-out}
#sheet .sh-hd{position:sticky;top:0;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;display:flex;align-items:center;z-index:2}
#sheet .sh-hd h2{font:700 22px var(--head);margin:0;flex:1}
#sheet .sh-hd button{padding:8px;margin:-8px}
#sheet .sh-bd{max-width:520px;margin:0 auto;padding:0 0 40px}
.ph-list{list-style:none;margin:0 16px;padding:0}
.ph-list li{padding:13px 4px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ph-list .zh{flex:1}.ph-list .lo{font-size:12.5px;color:var(--mute);display:block}
.ph-cat{font-size:11px;letter-spacing:.2em;color:var(--acc);margin:20px 20px 2px}
#zoom{position:fixed;inset:0;z-index:95;background:#fff;color:#111;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
#zoom.on{display:flex}
#zoom .lo{font:700 40px/1.35 -apple-system,"Helvetica Neue",Arial,sans-serif;word-break:break-word}
#zoom .zh{margin-top:26px;font-size:17px;color:#666}
#zoom .tip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));font-size:12px;color:#999;letter-spacing:.1em}
.sos li{padding:14px 4px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;list-style:none}
.sos{margin:0 16px;padding:0}
.sos .t{flex:1}.sos .t small{display:block;color:var(--mute);font-size:12px;line-height:1.5}
.sos a.call{flex:none;text-decoration:none;padding:8px 12px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font:700 14px var(--head);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tips{margin:0 16px}
.tips details{border-bottom:1px solid var(--line);padding:13px 4px}
.tips summary{font:700 16px var(--head);list-style:none;display:flex;align-items:center}
.tips summary::-webkit-details-marker{display:none}
.tips summary:after{content:"＋";margin-left:auto;color:var(--mute);font-weight:400}
.tips details[open] summary:after{content:"－"}
.tips p{margin:8px 0 0;font-size:14px;color:var(--mute)}
.driver{padding:20px;text-align:center}
.driver .ad{font:700 30px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;background:#fff;color:#111;border-radius:16px;padding:28px 18px;word-break:break-word}
.note{font-size:12px;color:var(--mute);margin:10px 0 0;line-height:1.6}
/* ============ v1.2 的調整 ============ */
:root{--nav:rgba(22,19,17,.82)}
html[data-theme=indo]{--nav:rgba(234,220,182,.88)}
html[data-theme=neon]{--nav:rgba(18,10,42,.78)}
html{touch-action:manipulation}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
/* 瀏海／狀態列那一條：內容捲過去時不會跟時間電量疊在一起；淺色風格用深色底，白色的狀態列文字才看得到 */
body:before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--nav);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);z-index:96;pointer-events:none}
html[data-theme=indo] body:before{background:var(--ink)}
html.has-cover body:before{display:none}
html[data-big] body{zoom:1.14}
html[data-theme=lacquer] body{background:radial-gradient(130% 440px at 50% -70px,#2c1811 0,rgba(44,24,17,0) 100%) no-repeat var(--bg)}
html[data-theme=lacquer] .card{background-image:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 46%)}
#nav{background:var(--nav);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2)}
.src{text-align:center;font-size:11px;color:var(--faint);padding:0 0 12px}
.src button{color:var(--mute);margin-left:8px;padding:6px 4px}
.notice{border-left:3px solid var(--acc)}
.notice p{margin:6px 0 0;font-size:14.5px}
.notice p b{font-weight:400;color:var(--mute);font-size:12px;margin-right:8px}
.notes{margin-top:14px;font-size:13.5px}
.notes summary{color:var(--mute);font-size:12px;letter-spacing:.08em;list-style:none;padding:4px 0}
.notes summary::-webkit-details-marker{display:none}
.notes summary:after{content:" ＋"}.notes[open] summary:after{content:" －"}
.notes .row{padding:7px 0;border-bottom:1px solid var(--line)}
.notes i{width:12px;height:12px;border-radius:3px;flex:none}
.showpw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin-top:14px}
.showpw input{width:18px;height:18px;accent-color:var(--acc)}
#zoom .spk{margin-top:30px;padding:12px 24px;border-radius:99px;border:1.5px solid #111;color:#111;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.tk-note a{color:inherit}
.me{margin:0 0 10px;padding:10px 12px;border-radius:12px;background:var(--acc-soft);font-size:14.5px;line-height:1.7}
.foot span{letter-spacing:.06em}
input[type=date].inp{min-height:44px;-webkit-appearance:none;appearance:none}
/* ============ 插圖 ============ */
.art{stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible;pointer-events:none}
.art .a{stroke:var(--acc)}.art .f{fill:var(--acc);stroke:none}.art .d{opacity:.42}
html[data-theme=neon] .art .a{filter:drop-shadow(0 0 3px var(--acc))}
.art.draw [pathLength]{stroke-dasharray:1;animation:artdraw 1.5s ease-out both}
.art.draw [pathLength]:nth-child(2n){animation-delay:.12s}.art.draw [pathLength]:nth-child(3n){animation-delay:.24s}.art.draw [pathLength]:nth-child(5n){animation-delay:.36s}
.art .steam path{animation:steam 2.8s ease-in-out infinite}.art .steam path:nth-child(2){animation-delay:-1.3s}
.art .drip{animation:drip 1.5s ease-in infinite}
.art .burst{transform-box:fill-box;transform-origin:center;animation:burst 2.6s ease-out infinite}.art .b2{animation-delay:-.9s}.art .b3{animation-delay:-1.7s}
.art .tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.2s ease-in-out infinite}.art .t2{animation-delay:-1.1s}
.art .cl1{animation:drift 7s ease-in-out infinite alternate}.art .cl2{animation:drift 9s ease-in-out infinite alternate-reverse}
.ph{position:relative}
.ph-art{position:absolute;right:14px;bottom:0;width:126px;height:84px;opacity:.92}
.ph-code,.ph h1{position:relative}
.day{display:grid;grid-template-columns:minmax(0,1fr) 104px;column-gap:6px;align-content:center}
.day>*{grid-column:1}
.day-art{grid-column:2;grid-row:1/span 3;align-self:end;width:104px;height:69px;margin-top:20px;opacity:.85}
.day .live{justify-self:start}
.art.sm{width:54px;height:36px}
.art.md{display:block;width:120px;height:80px;margin:0 auto 10px;opacity:.9}
.art.corner{position:absolute;right:12px;top:4px;width:63px;height:42px;opacity:.75}
.hotel{position:relative}.hotel h4,.hotel p{position:relative}
.loading{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px}
.sh-art{display:flex;justify-content:center;margin:2px 0 10px}.sh-art .art{width:132px;height:88px}
#lgArt .art{position:absolute;right:24px;top:calc(env(safe-area-inset-top) + 40px);width:120px;height:80px;opacity:.9}
.sct{overflow:visible}
.sct .eye{transform-origin:46.5px 18px;animation:blink 4.2s infinite}
.sct .body{animation:bob 2.4s ease-in-out infinite}
.sct .puff{fill:var(--mute);opacity:0;transform-box:fill-box;transform-origin:center}
#mascot.go .puff{animation:puff .7s ease-out}#mascot.go .p2{animation-delay:.1s}#mascot.go .p3{animation-delay:.2s}
.sct.big{width:120px;height:86px}
/* 主頁的小動畫 */
.trk{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:10.5px;letter-spacing:.14em;color:var(--mute)}
.trk b{font-weight:400}
.trk-l{flex:1;height:20px;position:relative;background:repeating-linear-gradient(90deg,var(--faint) 0 3px,transparent 3px 8px) center/100% 1px no-repeat}
.trk-l i{position:absolute;left:0;top:50%;height:1.5px;margin-top:-.75px;background:var(--acc);box-shadow:var(--glow);transform-origin:left;animation:draw 1.2s ease-out both}
.trk-l span{position:absolute;top:50%;margin:-11px 0 0 -8px;color:var(--acc);animation:fly 2.6s ease-in-out infinite}
.trk-l span .ic{display:block}
.dots{display:flex;align-items:center;margin-top:14px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--faint);flex:none}
.dots i.p{background:var(--acc);border-color:var(--acc)}
.dots i.n{border-color:var(--acc);background:var(--acc);animation:pulse 1.8s ease-out infinite}
.dots u{flex:1;height:1px;background:var(--line)}
.wxa.wx-sun{animation:spin 24s linear infinite}
.wxa.wx-pcloud,.wxa.wx-cloud,.wxa.wx-fog{animation:drift 5s ease-in-out infinite alternate}
.wxa.wx-rain,.wxa.wx-storm,.wxa.wx-snow{animation:fly 1.8s ease-in-out infinite}
.scene{position:relative;height:60px;margin:26px 0 -4px;overflow:hidden}
.scene .sky{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--faint);stroke-width:1.2;stroke-linejoin:round}
.scene .sky .moon{stroke:var(--acc);fill:var(--acc-soft)}
.scene .sky .gr{stroke:var(--line)}
.scene .rider{position:absolute;left:0;bottom:1px;width:40px;height:29px;animation:ride 15s linear infinite}
.bar i{transform-origin:left;animation:draw .8s ease-out both}
.page.on{animation:pagein .38s ease-out both}
#nav button.on .ic,#nav button.bump .ic{animation:navpop .42s cubic-bezier(.3,1.6,.5,1)}
.tk-mid .ic{animation:glide 3.4s ease-in-out infinite alternate}
.tk-stamp{position:absolute;right:18px;bottom:10px;z-index:2;padding:4px 10px;border:2px solid var(--acc);border-radius:6px;color:var(--acc);
  font:700 12px var(--head);letter-spacing:.14em;transform:rotate(-10deg);transform-origin:100% 50%;opacity:.8;pointer-events:none;white-space:nowrap}
.tk-stamp.hit{animation:stamp2 .5s cubic-bezier(.2,1.4,.4,1) both}
.coin{position:fixed;z-index:86;width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;
  font:700 15px var(--head);pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.25)}
#swoosh em{position:absolute;left:0;top:46%;width:70px;height:50px;margin-top:-8px;z-index:1;animation:rush .5s cubic-bezier(.45,.05,.55,.95) both}
#swoosh em .sct{width:70px;height:50px;display:block}
html:not([data-theme=indo]) #swoosh em{--acc:var(--bg)}
#swoosh.rev em{animation-name:rushR}
/* ============ 動畫 ============ */
@keyframes artdraw{from{stroke-dashoffset:1}}
@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:1}100%{transform:translateY(-6px);opacity:0}}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes burst{0%{transform:scale(.3);opacity:0}25%{opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.12);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.5);opacity:.3}50%{transform:scale(1);opacity:1}}
@keyframes drift{from{transform:translateX(-3px)}to{transform:translateX(4px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes puff{0%{opacity:.7;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(-8px,-5px) scale(1.4)}}
@keyframes fly{0%,100%{transform:translateY(-1.5px)}50%{transform:translateY(2px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--acc-soft)}100%{box-shadow:0 0 0 10px transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ride{0%{transform:translateX(-50px)}62%,100%{transform:translateX(560px)}}
@keyframes pagein{from{opacity:0;transform:translateY(8px)}}
@keyframes navpop{0%{transform:scale(1)}40%{transform:scale(1.25) translateY(-2px)}100%{transform:scale(1)}}
@keyframes glide{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
@keyframes stamp2{0%{opacity:0;transform:rotate(-10deg) scale(2.4)}60%{opacity:1;transform:rotate(-10deg) scale(.9)}100%{opacity:.8;transform:rotate(-10deg) scale(1)}}
@keyframes tin{from{opacity:0;transform:translateX(10px)}}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes lamp{0%,100%{background-color:var(--acc-soft)}50%{background-color:transparent}}
@keyframes charin{from{opacity:0;transform:translateY(14px)}}
@keyframes rush{0%{transform:translateX(-90px)}100%{transform:translateX(110vw)}}
@keyframes rushR{0%{transform:translateX(110vw) scaleX(-1)}100%{transform:translateX(-90px) scaleX(-1)}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes breath{0%,100%{box-shadow:0 0 0 0 rgba(219,82,54,0)}50%{box-shadow:0 0 26px 2px rgba(219,82,54,.5)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes putt{0%,100%{transform:none}30%{transform:translateY(-3px) rotate(-4deg)}60%{transform:translateY(1px) rotate(2deg)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes stamp{0%{opacity:0;transform:rotate(-9deg) scale(2.6)}60%{opacity:1;transform:rotate(-9deg) scale(.92)}100%{opacity:.85;transform:rotate(-9deg) scale(1)}}
@keyframes sweep{0%{transform:rotate(-9deg) translateX(-100%)}100%{transform:rotate(-9deg) translateX(100%)}}
@keyframes sweepR{0%{transform:rotate(9deg) translateX(100%)}100%{transform:rotate(9deg) translateX(-100%)}}
@keyframes shutter{0%{transform:scaleY(0);opacity:.9}45%{transform:scaleY(1);opacity:.9}100%{transform:scaleY(1);opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(.6) rotate(-8deg)}35%{opacity:1;transform:scale(1.1) rotate(-8deg)}100%{opacity:0;transform:scale(1) rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
  #swoosh{display:none!important}
}
</style>

<div id="offbar">目前沒有網路，顯示的是上次存下來的資料</div>
<div id="toast" role="status"></div>

<!-- 封面 -->
<section id="cover">
  <div class="art" id="coverArt"></div>
  <canvas id="sparks"></canvas>
  <div class="shade"></div>
  <div class="inner">
    <div class="kicker" id="cvKicker"></div>
    <h1 id="cvTitle"></h1>
    <div class="sub" id="cvSub"></div>
    <div class="rule"></div>
    <button id="enter" data-act="enter">點我進入<small id="cvLocal"></small></button>
  </div>
</section>

<!-- 登入 -->
<section id="login">
  <div class="box">
    <div id="lgArt"></div>
    <div class="ph-code">LOGIN <i>/</i> <span>Đăng nhập</span></div>
    <h2>登入</h2>
    <div class="ph-line" style="animation:draw .7s both"></div>
    <p class="note" id="lgNote"></p>
    <form id="lgForm" autocomplete="off">
      <div class="field"><label>暱稱（自己取，之後用同一個）</label><input class="inp" id="lgName" maxlength="12" autocapitalize="off" autocomplete="username"></div>
      <div class="field"><label>個人密碼（至少 4 個字，自己記得就好）</label><input class="inp" id="lgPin" type="password" maxlength="40" autocomplete="current-password"></div>
      <div class="field" id="lgGroupF"><label>團體密碼（問主辦人）</label><input class="inp" id="lgGroup" type="password" maxlength="60" autocomplete="off"></div>
      <label class="showpw"><input type="checkbox" id="lgShow"> 顯示密碼</label>
      <div class="err" id="lgErr" role="alert"></div>
      <button class="btn" id="lgBtn" type="submit">進入行程</button>
    </form>
  </div>
</section>

<!-- 五個分頁 -->
<main id="app" class="hide">
  <section class="page" id="p-home"></section>
  <section class="page" id="p-flight"></section>
  <section class="page" id="p-itin"></section>
  <section class="page" id="p-prep"></section>
  <section class="page" id="p-wallet"></section>
</main>

<nav id="nav" class="hide"><div class="in">
  <button data-act="go" data-p="home"><svg class="ic"><use href="#i-home"/></svg>主頁</button>
  <button data-act="go" data-p="flight"><svg class="ic"><use href="#i-plane"/></svg>航班</button>
  <button data-act="go" data-p="itin"><svg class="ic"><use href="#i-route"/></svg>行程</button>
  <button data-act="go" data-p="prep"><svg class="ic"><use href="#i-list"/></svg>準備</button>
  <button data-act="go" data-p="wallet"><svg class="ic"><use href="#i-wallet"/></svg>記帳</button>
</div></nav>

<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"><div class="sh-hd"><h2 id="shTitle"></h2><button data-act="closeSheet" aria-label="關閉"><svg class="ic l"><use href="#i-x"/></svg></button></div><div class="sh-bd" id="shBody"></div></section>
<section id="zoom" data-act="closeZoom"><div class="lo" id="zmLo" lang="vi"></div><div class="zh" id="zmZh"></div><button class="spk" data-act="speak"><svg class="ic"><use href="#i-sound"/></svg>聽發音</button><div class="tip">點一下關閉・螢幕會保持恆亮</div></section>
<div id="swoosh"><i></i><em></em><b></b></div>

<script src="data.js?v=1.2.0"></script>
<script src="app.js?v=1.2.0"></script>
</body>
</html>
